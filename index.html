<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Mentor - Live Spot Analytics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Indian Tri-Color Gradient Background */
        body {
            background: linear-gradient(135deg, #FF9933 0%, #0f172a 45%, #138808 100%);
            color: #ffffff;
            display: flex;
            min-height: 100vh;
        }

        /* Glassmorphism Sidebar */
        .sidebar {
            width: 260px;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 24px;
            border-right: 1px solid rgba(255, 255, 255, 0.15);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #FF9933;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: block;
            padding: 12px 16px;
            color: #cbd5e1;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item.active {
            background: rgba(255, 153, 51, 0.2);
            color: #ffffff;
            border-left: 4px solid #FF9933;
        }

        .main-content {
            flex: 1;
            padding: 32px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            padding: 16px 24px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            background: #138808;
            color: #ffffff;
            box-shadow: 0 0 10px rgba(19, 136, 8, 0.5);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
        }

        /* Glassmorphic Live Spot Cards */
        .card-box {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .index-title {
            font-size: 20px;
            font-weight: 700;
            color: #f8fafc;
        }

        .lot-info {
            font-size: 12px;
            color: #FF9933;
            background: rgba(255, 153, 51, 0.1);
            padding: 4px 10px;
            border-radius: 6px;
            font-weight: 600;
            border: 1px solid rgba(255, 153, 51, 0.2);
        }

        .price-container {
            height: 70px;
            display: flex;
            align-items: center;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            📈 Trading Mentor
        </div>
        <a href="#" class="nav-item active">Live Dashboard</a>
        <a href="#" class="nav-item">Nifty 50 (Lot: 65)</a>
        <a href="#" class="nav-item">Sensex (Lot: 20)</a>
        <a href="#" class="nav-item">Bank Nifty (Lot: 30)</a>
        <a href="#" class="nav-item">Option Analytics</a>
        <a href="#" class="nav-item">Settings</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Live Indian Indices Spot Monitor</h2>
            <span class="badge">● Live Market Stream</span>
        </div>

        <div class="cards-grid">
            <!-- NIFTY 50 CARD -->
            <div class="card-box">
                <div class="card-header">
                    <span class="index-title">NIFTY 50</span>
                    <span class="lot-info">Lot: 65 | Tue Expiry</span>
                </div>
                <div class="price-container">
                    <div class="tradingview-widget-container">
                        <div class="tradingview-widget-container__widget"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                        {
                        "symbol": "NSE:NIFTY",
                        "width": "100%",
                        "colorTheme": "dark",
                        "isTransparent": true,
                        "locale": "en"
                        }
                        </script>
                    </div>
                </div>
            </div>

            <!-- SENSEX CARD -->
            <div class="card-box">
                <div class="card-header">
                    <span class="index-title">SENSEX</span>
                    <span class="lot-info">Lot: 20 | Thu Expiry</span>
                </div>
                <div class="price-container">
                    <div class="tradingview-widget-container">
                        <div class="tradingview-widget-container__widget"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                        {
                        "symbol": "BSE:SENSEX",
                        "width": "100%",
                        "colorTheme": "dark",
                        "isTransparent": true,
                        "locale": "en"
                        }
                        </script>
                    </div>
                </div>
            </div>

            <!-- BANK NIFTY CARD -->
            <div class="card-box">
                <div class="card-header">
                    <span class="index-title">BANK NIFTY</span>
                    <span class="lot-info">Lot: 30 | Last Tue Expiry</span>
                </div>
                <div class="price-container">
                    <div class="tradingview-widget-container">
                        <div class="tradingview-widget-container__widget"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                        {
                        "symbol": "NSE:BANKNIFTY",
                        "width": "100%",
                        "colorTheme": "dark",
                        "isTransparent": true,
                        "locale": "en"
                        }
                        </script>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
