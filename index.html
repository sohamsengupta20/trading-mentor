<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Mentor - Pro Live Market Analytics</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            padding: 24px;
            border-right: 1px solid #334155;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item {
            display: block;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #334155;
            color: #f8fafc;
        }
        .main-content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #0284c7;
            color: #e0f2fe;
        }
        .ticker-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chart-container {
            width: 100%;
            height: 550px;
            background-color: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            📈 Trading Mentor
        </div>
        <a href="#" class="nav-item active">Live Dashboard</a>
        <a href="#" class="nav-item">Nifty 50 (Lot: 65)</a>
        <a href="#" class="nav-item">Sensex (Lot: 20)</a>
        <a href="#" class="nav-item">Bank Nifty (Lot: 30)</a>
        <a href="#" class="nav-item">Option Analytics</a>
        <a href="#" class="nav-item">Settings</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Market Analytics Workstation</h2>
            <span class="badge">● Live Market Feed Connected</span>
        </div>

        <!-- Live Ticker Widget -->
        <div class="ticker-container">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-tickers.js" async>
                {
                "symbols": [
                    {
                    "proName": "NSE:NIFTY",
                    "title": "NIFTY 50"
                    },
                    {
                    "proName": "BSE:SENSEX",
                    "title": "SENSEX"
                    },
                    {
                    "proName": "NSE:BANKNIFTY",
                    "title": "BANK NIFTY"
                    }
                ],
                "colorTheme": "dark",
                "isTransparent": true,
                "showSymbolLogo": true,
                "locale": "en"
                }
                </script>
            </div>
        </div>

        <!-- Live Interactive Chart Widget -->
        <div class="chart-container">
            <div class="tradingview-widget-container" style="height:100%;width:100%">
                <div id="tradingview_chart" style="height:calc(100% - 32px);width:100%"></div>
                <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
                <script type="text/javascript">
                new TradingView.widget(
                {
                "autosize": true,
                "symbol": "NSE:NIFTY",
                "interval": "5",
                "timezone": "Asia/Kolkata",
                "theme": "dark",
                "style": "1",
                "locale": "en",
                "toolbar_bg": "#f1f3f6",
                "enable_publishing": false,
                "allow_symbol_change": true,
                "container_id": "tradingview_chart"
                }
                );
                </script>
            </div>
        </div>
    </div>

</body>
</html>
