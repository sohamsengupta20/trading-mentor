<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Mentor - Live Spot Prices</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 250px;
            background-color: #1e293b;
            padding: 24px;
            border-right: 1px solid #334155;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #38bdf8;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-item {
            display: block;
            padding: 12px 16px;
            color: #94a3b8;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s;
        }
        .nav-item:hover, .nav-item.active {
            background-color: #334155;
            color: #f8fafc;
        }
        .main-content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: #0284c7;
            color: #e0f2fe;
        }
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .card-box {
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        .lot-info {
            font-size: 12px;
            color: #38bdf8;
            margin-top: 8px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            📈 Trading Mentor
        </div>
        <a href="#" class="nav-item active">Live Dashboard</a>
        <a href="#" class="nav-item">Nifty 50 (Lot: 65)</a>
        <a href="#" class="nav-item">Sensex (Lot: 20)</a>
        <a href="#" class="nav-item">Bank Nifty (Lot: 30)</a>
        <a href="#" class="nav-item">Option Analytics</a>
        <a href="#" class="nav-item">Settings</a>
    </div>

    <div class="main-content">
        <div class="header">
            <h2>Live Spot Price Monitor</h2>
            <span class="badge">● Live Feed Connected</span>
        </div>

        <div class="cards-grid">
            <!-- NIFTY 50 CARD -->
            <div class="card-box">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                    {
                    "symbol": "NSE:NIFTY",
                    "width": "100%",
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "locale": "en"
                    }
                    </script>
                </div>
                <div class="lot-info">1 Lot Size = 65 | Tuesday Expiry</div>
            </div>

            <!-- SENSEX CARD -->
            <div class="card-box">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                    {
                    "symbol": "BSE:SENSEX",
                    "width": "100%",
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "locale": "en"
                    }
                    </script>
                </div>
                <div class="lot-info">1 Lot Size = 20 | Thursday Expiry</div>
            </div>

            <!-- BANK NIFTY CARD -->
            <div class="card-box">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>
                    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js" async>
                    {
                    "symbol": "NSE:BANKNIFTY",
                    "width": "100%",
                    "colorTheme": "dark",
                    "isTransparent": true,
                    "locale": "en"
                    }
                    </script>
                </div>
                <div class="lot-info">1 Lot Size = 30 | Last Tuesday Expiry</div>
            </div>
        </div>
    </div>

</body>
</html>
